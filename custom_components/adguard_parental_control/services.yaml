apply_policies:
  name: Apply Policies
  description: Force re-evaluate and push all policies to AdGuard Home

set_override:
  name: Set Override
  description: Create a temporary override for a client or member
  fields:
    target:
      name: Target
      description: Name of the client or member
      required: true
      selector:
        text:
    target_type:
      name: Target Type
      description: Whether target is a client or member
      required: true
      selector:
        select:
          options:
            - client
            - member
    action:
      name: Action
      description: Override action
      required: true
      selector:
        select:
          options:
            - allow_all
            - block_all
            - custom
    duration_minutes:
      name: Duration (minutes)
      description: How long the override lasts
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
    custom_rules:
      name: Custom Rules
      description: Custom rules for "custom" action
      required: false
      selector:
        object:

clear_override:
  name: Clear Override
  description: Remove an override by ID
  fields:
    override_id:
      name: Override ID
      required: true
      selector:
        text:

clear_overrides_for:
  name: Clear Overrides For Target
  description: Remove all overrides for a specific client or member
  fields:
    target:
      name: Target
      required: true
      selector:
        text:
    target_type:
      name: Target Type
      required: false
      default: client
      selector:
        select:
          options:
            - client
            - member

sync_clients:
  name: Sync Clients
  description: Force refresh of client list from AdGuard Home
